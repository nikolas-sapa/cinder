[package]
name = "cinder"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "cinder"
path = "src/main.rs"

[dependencies]
cinder-core = { path = "../cinder-core" }
cinder-relay = { path = "../cinder-relay" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-textarea = "0.9.4"
unicode-width = "0.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
libc = "0.2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["std", "formatting"] }
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher"] }
hkdf = "0.13.0"
sha2 = "0.11.1"
data-encoding = "2.11.1"
thiserror = "2.0.21"
qrcode = "0.14.1"
secrecy = "0.10.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-local-authentication = { version = "0.3.2", default-features = false, features = [
    "std",
    "LAContext",
    "LAError",
    "block2",
] }
block2 = "0.6.2"

[dev-dependencies]
tempfile = "3"
