name: audit

on:
  schedule:
    # Daily at 04:23 UTC.
    - cron: "23 4 * * *"
  push:
    branches: [main]
    paths: [Cargo.lock]
  pull_request:
    paths: [Cargo.lock]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Plain cargo-audit instead of rustsec/audit-check: the action opens a
      # GitHub issue per informational warning on scheduled runs, which fails
      # with a read-only token. Exits non-zero on vulnerabilities only;
      # unmaintained warnings are printed but do not fail the job.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Reads .cargo/audit.toml for ignores (policy: zero ignores).
      - run: cargo audit

  deny-advisories:
    name: cargo deny check advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
