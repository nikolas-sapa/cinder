# Release pipeline — standard cargo-dist layout, hand-maintained.
# Regenerate with `cargo dist init` once cargo-dist is installed locally;
# [workspace.metadata.dist] in Cargo.toml is the source of truth for
# targets/installers and is validated by the `plan` job on every PR.
#
# Flow: plan -> build-local-artifacts (per-target tarball + SBOM)
#     -> publish-release (SHA256SUMS + minisign sigs -> draft GitHub Release)
#
# Required secrets:
#   MINISIGN_SECRET_KEY — unencrypted minisign secret key used to sign every
#                         release artifact. The matching public key should be
#                         committed at repo root as minisign.pub.
name: release

permissions:
  contents: write

on:
  pull_request:          # `plan` job keeps the dist config green on PRs
  push:
    tags: ["v*"]

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always
  CARGO_DIST_VERSION: "0.34.0"

jobs:
  # Validate [workspace.metadata.dist] + preview the release plan.
  plan:
    runs-on: ubuntu-latest
    outputs:
      publishing: ${{ !github.event.pull_request }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: install cargo-dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: cargo dist plan
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo dist plan --output-format=json | tee plan-dist-manifest.json
          else
            cargo dist plan --tag="${{ github.ref_name }}" --output-format=json | tee plan-dist-manifest.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: build (${{ matrix.target }})
    needs: plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # targets mirror [workspace.metadata.dist] in Cargo.toml
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build release binaries
        run: |
          cargo build --release --locked \
            --target "${{ matrix.target }}" \
            -p cinder -p cinder-relay
      - name: package tarball + sha256
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          stage="dist-artifacts/cinder-${tag}-${{ matrix.target }}"
          mkdir -p "$stage"
          for bin in cinder cinder-relay; do
            install -m 755 "target/${{ matrix.target }}/release/${bin}" "$stage/${bin}"
          done
          tar -C dist-artifacts -czf "dist-artifacts/cinder-${tag}-${{ matrix.target }}.tar.gz" \
            "cinder-${tag}-${{ matrix.target }}"
          rm -rf "$stage"
          (cd dist-artifacts && shasum -a 256 "cinder-${tag}-${{ matrix.target }}.tar.gz" \
            > "cinder-${tag}-${{ matrix.target }}.tar.gz.sha256")
      - name: generate SBOM (cargo-cyclonedx)
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --target "${{ matrix.target }}"
          mkdir -p dist-artifacts/sbom
          # cargo-cyclonedx writes <name>.cdx.json into the cwd (or target dir
          # on some versions) — collect wherever they landed.
          find . -name '*.cdx.json' -not -path './dist-artifacts/*' -print0 \
            | while IFS= read -r -d '' f; do
                mv "$f" "dist-artifacts/sbom/${{ matrix.target }}-$(basename "$f")"
              done
          ls dist-artifacts/sbom
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist-artifacts/

  publish-release:
    name: publish (draft)
    needs: [build-local-artifacts]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release
          merge-multiple: true
      - name: install minisign
        shell: bash
        run: |
          if ! command -v minisign >/dev/null; then
            sudo apt-get update && sudo apt-get install -y minisign
          fi
      - name: sign artifacts with minisign
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          find release -name '*.tar.gz' -print0 | while IFS= read -r -d '' f; do
            minisign -S -s /tmp/minisign.key -m "$f" -x "${f}.minisig" \
              -t "cinder ${GITHUB_REF_NAME}"
          done
      - name: aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          find release -name '*.tar.gz' -print0 | sort -z \
            | xargs -0 shasum -a 256 > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt
      - name: create draft release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release -type f ! -name '.*' | sort)
          printf '%s\n' "${files[@]}"
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "cinder ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${files[@]}"
