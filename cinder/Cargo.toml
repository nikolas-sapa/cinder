[package]
name = "cinder"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "cinder"
path = "src/main.rs"

[dependencies]
cinder-core = { path = "../cinder-core" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
dirs = "5"
