<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cinder — dither bayer hd experiment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#0B0C0E; --ink:#EDEDE8; --muted:#9BA0A6;
    --ember:#FFB224; --dim-ember:#5A4114; --line:#1E2126;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--ground);color:var(--ink);font-family:var(--mono);
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}

  .page{min-height:100vh;display:flex;flex-direction:column}
  header{padding:28px 32px;display:flex;justify-content:space-between;
    align-items:baseline;border-bottom:1px solid var(--line)}
  .tag{color:var(--ember);font-weight:500}
  .hint{color:var(--muted);font-size:12px}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:64px 0;gap:18px}

  /* --- the band: full-width 200px canvas strip ------------------- */
  .band{position:relative;height:200px;width:100%;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .band canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
  .hud{position:absolute;top:10px;left:14px;right:14px;display:flex;
    justify-content:space-between;pointer-events:none;
    font-size:10px;letter-spacing:.16em}
  .hud .l{color:var(--muted);opacity:.75}
  .hud .r{color:var(--dim-ember)}

  .caption{padding:0 32px;display:flex;justify-content:space-between;
    font-size:11px;color:var(--muted)}
  .caption b{color:#EDEDE8;font-weight:500}
</style>
</head>
<body>
<div class="page">
  <header>
    <span class="tag">cinder / experiments</span>
    <span class="hint">dither-bayer-hd — twin firefronts, ordered dither</span>
  </header>
  <main>
    <div class="band">
      <canvas id="field" aria-hidden="true"></canvas>
      <div class="hud">
        <span class="l">SIG/FLD — EMBER TELEMETRY</span>
        <span class="r">CH-64 · BAYER 8×8 + IGN · 13-LVL</span>
      </div>
    </div>
    <div class="caption">
      <span>cell: <b>4px</b> · rows: <b>50</b> · ramp: <b>charcoal → ember → white</b></span>
      <span>motion: <b id="mode">auto</b></span>
    </div>
  </main>
</div>

<script>
(function(){
  'use strict';

  /* ---------------------------------------------------------------
     DITHER BAYER-HD — tunables

     Canvas runs at CELL resolution (4px per cell) and is upscaled
     with image-rendering:pixelated — same trick as main.js, but the
     threshold is an 8x8 Bayer matrix blended with interleaved
     gradient noise (IGN) so the ordered pattern survives at large
     scales while IGN breaks up the fine periodicity.

     Composition: two firefronts. The field burns in from the left
     and right edges under a double-smoothstep envelope and dies to
     a cold static channel at dead center. Vertically the band is a
     fireline — hottest along the bottom edge, thinning upward.
     Sparks spawn inside the fronts, rise, sway, drift inward and
     die before reaching the channel.
  ---------------------------------------------------------------- */
  var CELL = 4, ROWS = 50, MAX_COLS = 480;
  var STAR_TOP = 13;                 // rows open to faint stars
  var STATIC_T = 6.0;                // frozen frame time, reduced motion
  var LEVELS, PAL = [
    [ 11, 12, 14],   // 0  ground
    [ 20, 21, 25],   // 1  whisper charcoal
    [ 33, 35, 41],   // 2  charcoal
    [ 50, 47, 38],   // 3  warm ash
    [ 74, 55, 22],   // 4  umber
    [106, 71, 20],   // 5  dim ember
    [146, 96, 24],   // 6  ember low
    [196,127, 27],   // 7  ember mid
    [232,152, 30],   // 8  ember high
    [255,178, 36],   // 9  brand ember #FFB224
    [255,190, 52],   // 10 hot amber
    [255,214,110],   // 11 hotter
    [255,240,196]    // 12 near-white
  ];
  LEVELS = PAL.length - 1;

  /* 8x8 Bayer thresholds, normalised to 0..1 */
  var TH8 = new Float32Array([
     0,32, 8,40, 2,34,10,42,
    48,16,56,24,50,18,58,26,
    12,44, 4,36,14,46, 6,38,
    60,28,52,20,62,30,54,22,
     3,35,11,43, 1,33, 9,41,
    51,19,59,27,49,17,57,25,
    15,47, 7,39,13,45, 5,37,
    63,31,55,23,61,29,53,21]);
  for (var i=0; i<64; i++) TH8[i] = (TH8[i]+0.5)/64;

  /* interleaved gradient noise (Jimenez) — per-cell, 0..1 */
  function ign(x, y){
    var f = (0.06711056*x + 0.00583715*y) % 1;
    return (52.9829189*f) % 1;
  }

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d', {alpha:false});
  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduced = mq.matches;

  var cols = 0, img = null, lvls = null;
  var stars = [], sparks = [];
  var raf = 0, running = false, inView = true;
  var last = 0, nextSpawn = 0;

  for (i=0; i<16; i++)
    stars.push([Math.random(), Math.random(), 0.4+Math.random()*1.8, Math.random()*6.28]);

  function resize(){
    cols = Math.min(MAX_COLS, Math.max(80, Math.ceil(canvas.clientWidth/CELL)));
    canvas.width = cols;
    canvas.height = ROWS;
    img = ctx.createImageData(cols, ROWS);
    lvls = new Uint8Array(cols*ROWS);
    if (reduced){ seedStatic(); draw(STATIC_T); }
  }

  function spawn(t){
    var left = Math.random() < 0.5;
    return {
      x0: left ? 2 + Math.random()*cols*0.26 : cols-3 - Math.random()*cols*0.26,
      y0: ROWS*0.60 + Math.random()*ROWS*0.36,
      vx: (left ? 1 : -1)*(0.4 + Math.random()*1.4),  // inward drift
      vy: 4.5 + Math.random()*5.5,
      amp: 0.6 + Math.random()*1.8,
      wf: 1.2 + Math.random()*2.6,
      ph: Math.random()*6.283,
      t0: t,
      ttl: 3.2 + Math.random()*3.0,
      big: Math.random() < 0.12
    };
  }

  /* deterministic mid-flight sparks for the frozen frame */
  function seedStatic(){
    sparks = [];
    for (var k=0; k<14; k++){
      var s = spawn(STATIC_T - 0.4 - k*0.31);
      s.ttl = 99;
      sparks.push(s);
    }
  }

  function put(x, y, lvl){
    if (x<0 || x>=cols || y<0 || y>=ROWS) return;
    var p = y*cols + x;
    if (lvls[p] >= lvl) return;
    lvls[p] = lvl;
    var o = p*4, c = PAL[lvl];
    img.data[o]=c[0]; img.data[o+1]=c[1]; img.data[o+2]=c[2]; img.data[o+3]=255;
  }

  function draw(t){
    var d = img.data, x, y, p, o;

    /* per-frame front breathing — the two fronts pump out of phase */
    var bL = 0.90 + 0.10*Math.sin(t*0.33);
    var bR = 0.90 + 0.10*Math.sin(t*0.33 + 2.3);
    var inv = 1/(cols-1);

    for (y=0; y<ROWS; y++){
      var q = y/(ROWS-1);
      var vp = q*q;                              // fireline: hot bottom, thin top
      /* domain warp is a pure function of the row — cheap fbm feel */
      var warp = 7.0*Math.sin(y*0.09 + t*0.27)
               + 3.0*Math.sin(y*0.23 - t*0.19)
               + 1.2*Math.sin(t*0.11 + y*0.05);
      var yrow = y*cols, brow = (y&7)<<3;

      for (x=0; x<cols; x++){
        /* horizontal envelope: edges burn, center dies (smoothstep twice) */
        var mx = x*inv*2 - 1;
        var a = mx<0 ? -mx : mx;
        var e = a*a*(3-2*a); e = e*e*(3-2*e);
        e *= (mx<0 ? bL : bR);

        /* domain-warped multi-octave sine field, ~-1..1 */
        var wx = x + warp;
        var v = 0.42*Math.sin(wx*0.030 + t*0.50 + y*0.110)
              + 0.26*Math.sin(wx*0.073 - t*0.38 + y*0.190 + 1.7)
              + 0.16*Math.sin(wx*0.160 + t*0.72 - y*0.090 + 4.1)
              + 0.10*Math.sin(wx*0.310 - t*1.15 + y*0.240 + 2.3)
              + 0.06*Math.sin(wx*0.520 + t*1.70 - y*0.380 + 5.6);
        v = v*0.68 + 0.5;                        // contrast-push to 0..1

        v = v*e*vp*1.6;
        /* cold-channel static: faint grain everywhere the field isn't */
        v += 0.004 + 0.007*ign(x+31, y+57);
        v = v<0 ? 0 : (v>1 ? 1 : v);
        v = v*v*(3-2*v)*0.45 + v*0.55;           // bias low, keep hot core

        /* hybrid threshold: ordered Bayer + fine IGN */
        var th = TH8[brow|(x&7)]*0.62 + ign(x,y)*0.38;
        var f = v*LEVELS;
        var lvl = f|0;
        if (f - lvl > th) lvl++;
        if (lvl > LEVELS) lvl = LEVELS;

        p = yrow + x;
        lvls[p] = lvl;
        o = p*4;
        var c = PAL[lvl];
        d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255;
      }
    }

    /* faint twinkling stars in the dead upper sky */
    for (var s2=0; s2<stars.length; s2++){
      var st = stars[s2];
      if (0.5 + 0.5*Math.sin(t*st[2] + st[3]) > 0.74)
        put((st[0]*cols)|0, (st[1]*STAR_TOP)|0, 3);
    }

    /* ember sparks: rise, sway, drift inward, fade out */
    for (var k=sparks.length-1; k>=0; k--){
      var s = sparks[k], age = t - s.t0;
      if (age > s.ttl){ sparks.splice(k,1); continue; }
      var sx = (s.x0 + s.vx*age + s.amp*Math.sin(t*s.wf + s.ph))|0;
      var sy = (s.y0 - s.vy*age)|0;
      var fade = 1 - age/s.ttl;
      var head = fade>0.55 ? 12 : (fade>0.3 ? 10 : 8);
      if (Math.sin(t*27 + s.ph) > 0.7) head = head<LEVELS ? head+1 : head;
      put(sx, sy, head);
      if (s.big) put(sx+1, sy, head-1);
      /* fading trail where it came from */
      put(sx, sy+1, head-3 > 4 ? head-3 : 4);
      put(sx, sy+2, head-6 > 4 ? head-6 : 4);
      put(sx, sy+3, 4);
    }

    ctx.putImageData(img, 0, 0);
  }

  function loop(now){
    raf = 0;
    var t = now/1000;
    if (t - last > 0.05) last = t - 0.05;        // clamp after tab sleep
    if (t >= nextSpawn && sparks.length < 36){
      sparks.push(spawn(t));
      nextSpawn = t + 0.18 + Math.random()*0.35;
    }
    draw(t);
    last = t;
    if (running) raf = requestAnimationFrame(loop);
  }

  function start(){
    if (!running && !reduced && !document.hidden && inView){
      running = true;
      if (!raf) raf = requestAnimationFrame(loop);
    }
  }
  function stop(){ running = false; if (raf){ cancelAnimationFrame(raf); raf=0; } }

  document.addEventListener('visibilitychange', function(){
    document.hidden ? stop() : start();
  });
  new IntersectionObserver(function(e){
    inView = e[0].isIntersecting;
    inView ? start() : stop();
  }).observe(canvas);

  if (mq.addEventListener) mq.addEventListener('change', function(e){
    reduced = e.matches;
    if (reduced){ stop(); seedStatic(); draw(STATIC_T); } else { start(); }
  });

  var rt; window.addEventListener('resize', function(){
    clearTimeout(rt); rt = setTimeout(resize, 150);
  });

  document.getElementById('mode').textContent =
    reduced ? 'static (reduced motion)' : 'live';
  resize();
  start();
})();
</script>
</body>
</html>
