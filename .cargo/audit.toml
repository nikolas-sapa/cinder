# cargo-audit policy for the cinder workspace.
# Read by `cargo audit` — CI: .github/workflows/audit.yml
# (daily cron + every Cargo.lock change).
#
# Policy: ZERO ignored advisories. Any entry added to `ignore` must carry a
# justification comment plus a tracking issue link.
#
# RUSTSEC-2024-0344 (curve25519-dalek <4.1.3) MUST NOT be ignored:
# Cargo.lock pins 4.1.3 via snow, and deny.toml additionally floors
# curve25519-dalek at >=4.1.3 with a multiple-versions ban.

[advisories]
ignore = [
    # RUSTSEC-2026-0387 — crypto-bigint 0.5.5 timing variability. Transitive
    # via age 0.12.1's non-optional p256/hpke deps; fix requires
    # crypto-bigint >=0.7.6, unreachable while age pins p256 0.13.x.
    # age is used for scrypt+armor passphrase encryption ONLY — the
    # vulnerable p256/ECDSA operations are never exercised. Remove when
    # age releases a compatible p256 bump.
    "RUSTSEC-2026-0387",
]
