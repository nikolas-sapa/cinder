[package]
name = "cinder-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
snow = "0.9"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
sha2 = "0.10"
data-encoding = "2"
thiserror = "2"
anyhow = "1"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
