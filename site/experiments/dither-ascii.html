<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cinder — dither ascii experiment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#0B0C0E; --ink:#EDEDE8; --muted:#9BA0A6;
    --ember:#FFB224; --dim-ember:#5A4114; --line:#1E2126;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--ground);color:var(--ink);font-family:var(--mono);
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column}

  header{padding:28px 32px;display:flex;justify-content:space-between;
    align-items:baseline;border-bottom:1px solid var(--line)}
  .tag{color:var(--ember);font-weight:500}
  .hint{color:var(--muted);font-size:12px}

  main{flex:1;display:flex;flex-direction:column;justify-content:center}

  /* --- the band: full-width 200px strip ------------------------- */
  .band{position:relative;width:100%;height:200px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .band canvas{display:block;width:100%;height:100%;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}

  .meta{padding:14px 32px 0;display:flex;justify-content:space-between;
    font-size:11px;color:var(--muted);opacity:.8}
  .meta b{color:var(--ink);font-weight:500}
  .meta .ramp{color:var(--ember)}
</style>
</head>
<body>
<header>
  <span class="tag">cinder / experiments</span>
  <span class="hint">dither-ascii — bayer-ordered ember band</span>
</header>
<main>
  <section class="band"><canvas id="field" aria-hidden="true"></canvas></section>
  <div class="meta">
    <span>grid <b id="dims">–</b> · ramp <b class="ramp">.·:+*#%@</b> · bayer 8×8 · <b id="count">0</b> glyphs drawn</span>
    <span>motion: <b id="mode">auto</b></span>
  </div>
</main>

<script>
(function(){
  'use strict';

  /* ---------------------------------------------------------------
     DITHER-ASCII HEAT BAND — tunables
     ROWS      : glyph rows inside the 200px band (cellH = H/ROWS)
     COL_W     : px per glyph column; cols = W/COL_W
     RAMP      : luminance ramp, index 0 = space (drawn = skipped)
     BAYER     : 8×8 ordered threshold matrix (b/64)
     LUT       : 256 colors, dim-ember → ember → hot
     SPARK_P   : per-frame ignition probability, SPARK_MAX cap
     SPARK_LIFE/ATT : spark envelope — fast attack, slow decay
  ---------------------------------------------------------------- */
  var ROWS = 14, COL_W = 8, FONT_PX = 13;
  var RAMP = ' .·:+*#%@', LVL = RAMP.length;
  var BAYER = [
     0,32, 8,40, 2,34,10,42, 48,16,56,24,50,18,58,26,
    12,44, 4,36,14,46, 6,38, 60,28,52,20,62,30,54,22,
     3,35,11,43, 1,33, 9,41, 51,19,59,27,49,17,57,25,
    15,47, 7,39,13,45, 5,37, 63,31,55,23,61,29,53,21];
  var SPARK_MAX = 12, SPARK_P = 0.045, SPARK_LIFE = 1.5, SPARK_ATT = 0.12;
  var T_STATIC = 8.0;                       // frozen-frame time for reduced motion

  // luminance → color LUT: #5A4114 → #FFB224 → #FFE9C4
  var LUT = [];
  (function(){
    var stops = [[90,65,20],[255,178,36],[255,233,196]];
    for (var i = 0; i < 256; i++){
      var t = i/255, lo = t < 0.5, k = lo ? t*2 : (t-0.5)*2;
      var a = stops[lo?0:1], b = stops[lo?1:2];
      LUT[i] = 'rgb(' + Math.round(a[0]+(b[0]-a[0])*k) + ','
                      + Math.round(a[1]+(b[1]-a[1])*k) + ','
                      + Math.round(a[2]+(b[2]-a[2])*k) + ')';
    }
  })();

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');
  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduced = mq.matches;

  var W = 0, H = 0, cols = 0, cellH = 0, charW = 0, glyphDx = 0;
  var heat = null, sparks = [];
  var raf = 0, running = false, inView = true;

  /* flowing brightness field: 3 primary waves + fine octave,
     biased so edges sit dark and the center carries ember ridges */
  function lum(gx, gy, t){
    var nx = gx*0.14, ny = gy*0.34;
    var v = Math.sin(nx + t*0.55)
          + Math.sin(ny*0.9 - t*0.38 + nx*0.6)
          + Math.sin((nx*0.7 + ny)*0.9 + t*0.8)
          + 0.45*Math.sin(nx*2.3 - ny*1.7 + t*1.15);
    return v*0.24 + 0.46;
  }

  function resize(){
    var dpr = Math.min(window.devicePixelRatio||1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.font = '500 ' + FONT_PX + 'px "JetBrains Mono",monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    charW = ctx.measureText('M').width;
    glyphDx = Math.max(0, (COL_W - charW)*0.5);
    cols = Math.ceil(W/COL_W); cellH = H/ROWS;
    heat = new Float32Array(cols*ROWS);
    document.getElementById('dims').textContent = cols + '×' + ROWS;
    if (reduced){ seedStatic(); drawFrame(T_STATIC); }
  }

  /* deterministic ignitions so the static frame still shows hot cells */
  function seedStatic(){
    sparks.length = 0;
    var pts = [[0.22,0.36],[0.55,0.62],[0.81,0.30]];
    for (var i = 0; i < pts.length; i++)
      sparks.push({x:(cols*pts[i][0])|0, y:(ROWS*pts[i][1])|0,
                   t0:T_STATIC - 0.3 - i*0.18, seed:i*3.1});
  }

  function drawFrame(now){
    ctx.clearRect(0,0,W,H);
    heat.fill(0);
    for (var s = 0; s < sparks.length; s++){
      var sp = sparks[s], age = now - sp.t0;
      var env = age < SPARK_ATT ? age/SPARK_ATT
                                : 1 - (age-SPARK_ATT)/(SPARK_LIFE-SPARK_ATT);
      if (env <= 0) continue;
      heat[sp.y*cols + sp.x] = 1.18 * env * (0.7 + 0.3*Math.sin(age*22 + sp.seed));
    }

    var drawn = 0, last = '';
    var midY = (ROWS-1)*0.5;
    for (var gy = 0; gy < ROWS; gy++){
      var envY = 1 - Math.abs(gy-midY)/ROWS*0.85;   // vertical falloff ~0.58..1
      var yPos = gy*cellH + cellH*0.5;
      for (var gx = 0; gx < cols; gx++){
        var v = lum(gx,gy,now)*envY + heat[gy*cols+gx];
        if (v <= 0) continue;
        var f = v*(LVL-1);
        var base = f|0; if (base < 0) base = 0;
        // ordered dither: fractional part vs bayer threshold
        var lvl = base + ((f-base) > BAYER[(gy&7)*8 + (gx&7)]*0.015625 ? 1 : 0);
        if (lvl <= 0) continue;
        if (lvl >= LVL) lvl = LVL-1;
        var c = LUT[v > 1 ? 255 : (v*255)|0];
        if (c !== last){ ctx.fillStyle = c; last = c; }
        ctx.fillText(RAMP[lvl], gx*COL_W + glyphDx, yPos);
        drawn++;
      }
    }
    document.getElementById('count').textContent = drawn;
  }

  function tick(ts){
    var now = ts/1000;
    if (sparks.length < SPARK_MAX && Math.random() < SPARK_P)
      sparks.push({x:(Math.random()*cols)|0, y:(Math.random()*ROWS)|0,
                   t0:now, seed:Math.random()*9});
    for (var i = sparks.length-1; i >= 0; i--)
      if (now - sparks[i].t0 > SPARK_LIFE) sparks.splice(i,1);
    drawFrame(now);
    if (running) raf = requestAnimationFrame(tick);
  }

  function sync(){
    if (!reduced && inView && !document.hidden && !running){
      running = true; raf = requestAnimationFrame(tick);
    } else if ((reduced || !inView || document.hidden) && running){
      running = false; cancelAnimationFrame(raf);
    }
  }

  new IntersectionObserver(function(e){
    inView = e[0].isIntersecting; sync();
  }).observe(canvas);
  document.addEventListener('visibilitychange', sync);

  if (mq.addEventListener) mq.addEventListener('change', function(){
    reduced = mq.matches; sync();
    if (reduced){ seedStatic(); drawFrame(T_STATIC); }
  });

  var rt; window.addEventListener('resize', function(){
    clearTimeout(rt); rt = setTimeout(resize, 150);
  });

  document.getElementById('mode').textContent =
    reduced ? 'static (reduced motion)' : 'live';
  resize();
  sync();
})();
</script>
</body>
</html>
