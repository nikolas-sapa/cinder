<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cinder — dither rutt-etra experiment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#0B0C0E; --ink:#EDEDE8; --muted:#9BA0A6;
    --ember:#FFB224; --dim-ember:#5A4114; --line:#1E2126;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--ground);color:var(--ink);font-family:var(--mono);
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}

  .page{min-height:100vh;display:flex;flex-direction:column}
  header{padding:28px 32px;display:flex;justify-content:space-between;
    align-items:baseline;border-bottom:1px solid var(--line)}
  .tag{color:var(--ember);font-weight:500}
  .hint{color:var(--muted);font-size:12px}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:64px 0;gap:18px}

  /* --- the band: full-width 240px canvas strip ------------------- */
  .band{position:relative;height:240px;width:100%;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .band canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;top:10px;left:14px;right:14px;display:flex;
    justify-content:space-between;pointer-events:none;
    font-size:10px;letter-spacing:.16em}
  .hud .l{color:var(--muted);opacity:.75}
  .hud .r{color:var(--dim-ember)}

  .caption{padding:0 32px;display:flex;justify-content:space-between;
    font-size:11px;color:var(--muted)}
  .caption b{color:var(--ink);font-weight:500}
</style>
</head>
<body>
<div class="page">
  <header>
    <span class="tag">cinder / experiments</span>
    <span class="hint">dither-rutt-etra — ordered-dither scanline terrain</span>
  </header>
  <main>
    <div class="band">
      <canvas id="field" aria-hidden="true"></canvas>
      <div class="hud">
        <span class="l">SIG/FLD — EMBER TELEMETRY</span>
        <span class="r">CH-26 · BAYER 4×4</span>
      </div>
    </div>
    <div class="caption">
      <span>raster lines: <b>26</b> · persistence: <b>phosphor</b></span>
      <span>motion: <b id="mode">auto</b></span>
    </div>
  </main>
</div>

<script>
(function(){
  'use strict';

  /* ---------------------------------------------------------------
     DITHER RUTT-ETRA — tunables
     LINES  : horizontal raster count
     CELL   : px per dither column
     AMP    : max upward displacement, px
     FADE   : phosphor persistence (0..1, higher = shorter trail)
     STAR   : heat threshold for bright star cells
  ---------------------------------------------------------------- */
  var LINES = 26, CELL = 6, AMP = 30, FADE = 0.16, STAR = 0.88;
  var TOP = 22, BOTTOM_PAD = 16;
  var FREQ_X = 0.011;             // horizontal field frequency
  var SPEED = 0.55;               // field flow rate

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d', {alpha:false});
  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduced = mq.matches;
  var W = 0, H = 0, raf = 0, running = false, t0 = performance.now();

  /* Bayer 4x4 ordered-dither thresholds, normalised to 0..1 */
  var BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
  for (var i=0; i<16; i++) BAYER[i] = BAYER[i]/16;

  /* integer hash -> 0..1, basis for value noise */
  function h2(x, y){
    var n = (Math.imul(x, 374761393) + Math.imul(y, 668265263))|0;
    n = Math.imul(n ^ (n>>>13), 1274126177);
    return ((n ^ (n>>>16))>>>0)/4294967296;
  }
  function vnoise(x, y){
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x-xi, yf = y-yi;
    var u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
    var a = h2(xi,yi), b = h2(xi+1,yi), c = h2(xi,yi+1), d = h2(xi+1,yi+1);
    return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
  }
  /* flowing field: slow swells + finer ripple, returns ~0..1 */
  function field(x, l, t){
    return vnoise(x, l*1.7 - t)*0.62
         + vnoise(x*3.1 + 40, l*4.0 - t*2.3)*0.38;
  }

  function resize(){
    var dpr = Math.min(window.devicePixelRatio||1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = '#0B0C0E'; ctx.fillRect(0,0,W,H);
    if (reduced) render(2.35, false);               // static frame only
  }

  function render(t, persist){
    if (persist){
      ctx.fillStyle = 'rgba(11,12,14,'+FADE+')';    // phosphor trail
      ctx.fillRect(0,0,W,H);
    } else {
      ctx.fillStyle = '#0B0C0E'; ctx.fillRect(0,0,W,H);
    }

    var spacing = (H - TOP - BOTTOM_PAD)/(LINES-1);
    var cols = Math.ceil(W/CELL);
    var half = CELL>>1, tick = (t*6)|0;             // star twinkle slot
    var fill = '';

    for (var l=0; l<LINES; l++){
      var baseY = TOP + l*spacing;
      var ly = l*0.42;

      /* faint scanline guide */
      ctx.fillStyle = 'rgba(237,237,232,0.028)';
      ctx.fillRect(0, baseY|0, W, 1);
      fill = 'rgba(237,237,232,0.028)';

      var brow = (l&3)<<2;
      for (var c=0; c<cols; c++){
        var x = c*CELL + half;
        var env = 0.3 + 0.9*vnoise(x*0.0035 - t*0.22, l*0.05 + 3.1);
        var g = field(x*FREQ_X, ly, t*SPEED) * env;  // displacement weight
        var y = baseY - g*AMP;
        var heat = (g - 0.30)*2.1;
        if (heat < 0) heat = 0; else if (heat > 1) heat = 1;

        /* ordered dither: heat must beat the Bayer threshold */
        if (heat <= BAYER[brow | (c&3)] + 0.02) continue;

        var col, s;
        if (heat > STAR && h2(c, l*131 + tick) > 0.955){
          /* sparse star cell: ink core + ember flare */
          ctx.fillStyle = 'rgba(255,178,36,0.30)';
          ctx.fillRect(c*CELL, (y|0)-2, CELL, 1);
          ctx.fillRect(c*CELL, (y|0)+2, CELL, 1);
          ctx.fillStyle = '#EDEDE8';
          ctx.fillRect(c*CELL + half - 1, (y|0)-1, 3, 3);
          fill = '#EDEDE8';
          continue;
        } else if (heat < 0.4){ col = '#5A4114'; s = 2; }
        else if (heat < 0.75){ col = '#C8851B'; s = 2; }
        else { col = '#FFB224'; s = 3; }

        if (col !== fill){ ctx.fillStyle = col; fill = col; }
        ctx.fillRect(c*CELL + ((CELL-s)>>1), y|0, s, s);
      }
    }
  }

  function loop(now){
    raf = 0;
    render((now - t0)/1000, true);
    if (running) raf = requestAnimationFrame(loop);
  }
  function start(){
    if (!running && !reduced && !document.hidden){
      running = true;
      if (!raf) raf = requestAnimationFrame(loop);
    }
  }
  function stop(){ running = false; if (raf){ cancelAnimationFrame(raf); raf = 0; } }

  /* pause when tab hidden or band scrolled offscreen */
  document.addEventListener('visibilitychange', function(){
    document.hidden ? stop() : start();
  });
  new IntersectionObserver(function(e){
    e[0].isIntersecting ? start() : stop();
  }).observe(canvas);

  /* react to OS-level motion preference changes */
  if (mq.addEventListener) mq.addEventListener('change', function(e){
    reduced = e.matches;
    if (reduced){ stop(); render(2.35, false); } else { start(); }
  });

  var rt; window.addEventListener('resize', function(){
    clearTimeout(rt); rt = setTimeout(resize, 150);
  });

  document.getElementById('mode').textContent =
    reduced ? 'static (reduced motion)' : 'live';
  resize();
  start();
})();
</script>
</body>
</html>
