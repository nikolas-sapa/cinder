[package]
name = "cinder-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
cinder-core = { path = "../cinder-core" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
